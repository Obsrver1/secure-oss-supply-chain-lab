# Dependency policy for pull-request dependency changes.
#
# Vulnerability policy:
# - Block HIGH and CRITICAL vulnerabilities.
# - Evaluate runtime, development, and unknown scopes.
#
# License policy:
# - Newly introduced dependencies must use one of the explicitly
#   approved permissive licenses below.

fail-on-severity: high

fail-on-scopes:
  - runtime
  - development
  - unknown

vulnerability-check: true
license-check: true
warn-only: false

allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC

show-openssf-scorecard: true
warn-on-openssf-scorecard-level: 3
show-patched-versions: true

comment-summary-in-pr: never
